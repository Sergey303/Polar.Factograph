name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Polar.DB dependency
        shell: bash
        run: |
          set -euo pipefail
          polar_db_sha="$(tr -d '[:space:]' < eng/PolarDb.version)"
          rm -rf ../../Polar.DB
          git init ../../Polar.DB
          git -C ../../Polar.DB remote add origin https://github.com/Sergey303/Polar.DB.git
          git -C ../../Polar.DB fetch --depth=1 origin "$polar_db_sha"
          git -C ../../Polar.DB checkout --detach FETCH_HEAD
          echo "Polar.DB dependency: $(git -C ../../Polar.DB rev-parse HEAD)"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: bash
        run: |
          set +e
          dotnet restore Polar.Factograph.slnx > restore.log 2>&1
          exit_code=$?
          cat restore.log
          exit $exit_code
      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-log
          path: restore.log

      - name: Build
        shell: bash
        run: |
          set +e
          dotnet build Polar.Factograph.slnx --configuration Release --no-restore > build.log 2>&1
          exit_code=$?
          cat build.log
          exit $exit_code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Test
        shell: bash
        run: |
          set +e
          dotnet test Polar.Factograph.slnx --configuration Release --no-build > test.log 2>&1
          exit_code=$?
          cat test.log
          exit $exit_code
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
