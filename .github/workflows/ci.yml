name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: bash
        run: |
          set +e
          dotnet restore Polar.Factograph.slnx > restore.log 2>&1
          exit_code=$?
          cat restore.log
          exit $exit_code
      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-log
          path: restore.log

      - name: Build
        shell: bash
        run: |
          set +e
          dotnet build Polar.Factograph.slnx --configuration Release --no-restore > build.log 2>&1
          exit_code=$?
          cat build.log
          exit $exit_code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Test
        shell: bash
        run: |
          set +e
          dotnet test Polar.Factograph.slnx --configuration Release --no-build > test.log 2>&1
          exit_code=$?
          cat test.log
          exit $exit_code
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
