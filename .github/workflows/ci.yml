name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Polar.DB dependency
        shell: bash
        run: |
          set -euo pipefail
          polar_db_sha="$(tr -d '[:space:]' < eng/PolarDb.version)"
          rm -rf ../../Polar.DB
          git init ../../Polar.DB
          git -C ../../Polar.DB remote add origin https://github.com/Sergey303/Polar.DB.git
          git -C ../../Polar.DB fetch --depth=1 origin "$polar_db_sha"
          git -C ../../Polar.DB checkout --detach FETCH_HEAD
          echo "Polar.DB dependency: $(git -C ../../Polar.DB rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install web dependencies
        working-directory: src/Polar.Factograph.Web
        shell: bash
        run: |
          set +e
          npm install --package-lock=false --no-audit --no-fund > web-install.log 2>&1
          exit_code=$?
          cat web-install.log
          exit $exit_code
      - name: Build web
        working-directory: src/Polar.Factograph.Web
        shell: bash
        run: |
          set +e
          npm run build > web-build.log 2>&1
          exit_code=$?
          cat web-build.log
          exit $exit_code
      - name: Upload web logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-logs
          path: |
            src/Polar.Factograph.Web/web-install.log
            src/Polar.Factograph.Web/web-build.log

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: bash
        run: |
          set +e
          dotnet restore Polar.Factograph.slnx > restore.log 2>&1
          exit_code=$?
          cat restore.log
          exit $exit_code
      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-log
          path: restore.log

      - name: Build
        shell: bash
        run: |
          set +e
          dotnet build Polar.Factograph.slnx --configuration Release --no-restore > build.log 2>&1
          exit_code=$?
          cat build.log
          exit $exit_code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Test
        shell: bash
        run: |
          set +e
          dotnet test Polar.Factograph.slnx --configuration Release --no-build > test.log 2>&1
          exit_code=$?
          cat test.log
          exit $exit_code
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Validate release publish
        shell: bash
        run: |
          set +e
          python -m json.tool scripts/run/appsettings.json > /dev/null
          json_exit=$?
          dotnet publish src/Polar.Factograph.Api/Polar.Factograph.Api.csproj \
            --configuration Release \
            --no-restore \
            -p:SkipFactographWebBuild=true \
            -o artifacts/publish-test > publish.log 2>&1
          publish_exit=$?
          cat publish.log
          if [ $json_exit -ne 0 ] || [ $publish_exit -ne 0 ]; then
            exit 1
          fi
          test -f artifacts/publish-test/Polar.Factograph.Api.dll
          test -f artifacts/publish-test/wwwroot/index.html
      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: publish.log
