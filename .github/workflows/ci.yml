name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Polar.Factograph.slnx
      - run: dotnet build Polar.Factograph.slnx --configuration Release --no-restore
      - run: dotnet test Polar.Factograph.slnx --configuration Release --no-build
